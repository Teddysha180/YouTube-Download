# render.yaml
services:
  - type: worker
    name: youtube-downloader-bot
    runtime: python
    repo: https://github.com/YOUR_USERNAME/youtube-downloader-bot
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false  # You'll set this manually
      - key: ALLOWED_USERS
        value: ""  # Comma-separated user IDs, leave empty for public
